[build]
  command = "npm run build"
  publish = "dist"

# Long-cache the self-hosted placeholder images and uploads
[[headers]]
  for = "/placeholders/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
