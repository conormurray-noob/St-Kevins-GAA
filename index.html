<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crest-clubzap.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>St. Kevin's GAA Club — Staplestown, Kildare</title>
  </head>
  <body>
    <!-- Static mirror of the Get Involved form so Netlify Forms detects it at build time -->
    <form name="get-involved" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
